<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de Login</title>
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/css/bootstrap.min.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #4171d8;
      }

      .fundo-informacoes {
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 100%;
        max-height: 100%;
        min-height: 100vh;
      }

      form {
        text-align: center;
        background-color: #6182cb;
        width: min(520px, calc(100% - 2rem));
        padding: 50px;
        box-sizing: border-box;
        color: #fff;
        border-radius: 100px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 10px;
        margin-bottom: 20px;
        border: none;
        border-radius: 50px;
        color: #fff;
        background-color: #8196c1;
      }

      input::placeholder {
        color: #fff;
        opacity: 0.5;
      }

      .Login-Texto {
        font-size: 30px;
        margin-bottom: 20px;
        justify-content: flex-start;
        align-items: flex-start;
        height: 100px;
      }

      .botao {
        width: 50%;
        padding: 10px;
        border: none;
        border-radius: 50px;
        background-color: #fff;
        color: #4171d8;
        font-size: 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="fundo-informacoes">
      <form action="login.php" method="POST">
        <h2 class="Login-Texto">Login</h2>
        <input type="text" placeholder="E-mail:" /><br />
        <input type="password" placeholder="Senha:" /><br />
        <button type="submit" class="botao">Entrar</button>
        <p><a href="esqueceu-senha.html" style="color: #fff; text-decoration: underline;">Esqueceu a senha?</a></p>
        <p><a href="cadastro.html" style="color: #fff; text-decoration: underline;">Não tem uma conta? Cadastre-se aqui.</a></p>
      </form>
    </div>
  </body>
</html>
